{{define "content"}}
<div class="auth-card">
  <h1>Sign up</h1>
  <p class="muted">For learners joining the academy. If you're a mentor or academy head, ask an admin to set up your account.</p>

  {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
  {{end}}

  <form method="POST" action="/signup">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required autofocus>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="8">

    <button type="submit" class="btn btn-primary btn-block">Sign up</button>
  </form>
  <p class="muted" style="margin-top:12px">Already have an account? <a href="/login">Log in</a></p>
</div>
{{end}}
