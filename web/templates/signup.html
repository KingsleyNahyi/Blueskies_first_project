\{{define "content"}}
<div class="auth-card">
  <h1>Sign up</h1>
  <p class="muted">Create a new account as a mentee or a mentor.</p>

  {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
  {{end}}

  <form method="POST" action="/signup">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required autofocus>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="8">

    <label for="role">Role</label>
    <select id="role" name="role" required style="margin-bottom: 16px; width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
      <option value="mentee" selected>Mentee</option>
      <option value="mentor">Mentor</option>
      <option value="admin">Admin</option>
    </select>

    <button type="submit" class="btn btn-primary btn-block">Sign up</button>
  </form>
  <p class="muted" style="margin-top:12px">Already have an account? <a href="/login">Log in</a></p>
</div>
{{end}}
