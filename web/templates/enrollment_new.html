{{define "content"}}
<div class="course-header">
  <h1>Enroll a mentee</h1>
</div>

{{if .Error}}
  <div class="alert alert-error">{{.Error}}</div>
{{end}}

{{if not .Courses}}
  <p class="muted">You don't have any courses yet. <a href="/courses/new">Create one first</a>.</p>
{{else}}
<div class="card">
  <form method="POST" action="/enrollments">
    <label for="course_id">Course</label>
    <select id="course_id" name="course_id" required>
      {{range .Courses}}
        <option value="{{.ID}}">{{.Title}}</option>
      {{end}}
    </select>

    <label for="mentee_id">Mentee</label>
    <select id="mentee_id" name="mentee_id" required>
      {{range .Mentees}}
        <option value="{{.ID}}">{{.Name}} ({{.Email}})</option>
      {{end}}
    </select>

    <label for="days_per_task">Days between each task's due date</label>
    <input type="number" id="days_per_task" name="days_per_task" value="2" min="1">
    <p class="muted">Due dates get spread automatically from today, one task every N days.</p>

    <button type="submit" class="btn btn-primary btn-block">Enroll mentee</button>
  </form>
</div>
{{end}}
{{end}}
